# The quant package (src/quant; the wiki page Architecture) and the configuration of pytest, ruff and mypy.
# `pip install -e .` makes the package importable from anywhere and adds the `quant` command (quant.cli).
# Dependencies are pinned in requirements/core.lock.txt.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quant"
version = "0.1.0"
description = "Point-in-time US equity research and paper-trading framework: data-source plugins, release contract, guarded order path"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
quant = "quant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["quant*"]

[tool.pytest.ini_options]
testpaths = ["src", "tests", "tools"]
pythonpath = ["src"]
markers = ["integration: slow tests that read real data"]
addopts = '-m "not integration"'
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
cache-dir = ".cache/ruff"
extend-exclude = ["rust_core"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "B", "SIM115", "PLE", "PLW1510"]

[tool.mypy]
python_version = "3.11"
strict = true
follow_imports = "silent"
explicit_package_bases = true
cache_dir = ".cache/mypy"
mypy_path = ["$MYPY_CONFIG_FILE_DIR/tools", "$MYPY_CONFIG_FILE_DIR/src"]
files = ["src/quant/cli.py", "src/quant/core", "src/quant/data/sources", "src/quant/features/sources.py", "src/quant/models", "src/quant/portfolio",
         "src/quant/execution", "tools"]
exclude = '(^|/)tests/'

[[tool.mypy.overrides]]
module = ["scipy.*", "statsmodels.*", "yfinance.*"]
ignore_missing_imports = true
